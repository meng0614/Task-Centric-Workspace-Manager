[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-task-workspace-manager"
version = "0.1.0"
description = "A task-centric workspace and skill governance manager for Codex/OpenClaw users."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Codex Task Workspace Manager contributors"}]
keywords = ["codex", "openclaw", "workspace", "skills", "task-management"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.scripts]
workspace-manager = "codex_task_workspace_manager.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
